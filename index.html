<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер волонтёров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            text-align: center;
        }
        .card {
            width: 100%;
            max-width: 360px;
            background: var(--tg-theme-secondary-bg-color, #232e3c);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { font-size: 18px; margin-bottom: 6px; font-weight: 700; }
        p { font-size: 12px; color: var(--tg-theme-hint-color, #7f91a4); margin-bottom: 14px; }
        #reader {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid var(--tg-theme-button-color, #2481cc);
        }
        #reader video { object-fit: cover !important; }
        #result-box {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(76, 217, 100, 0.15);
            border: 1px solid #4cd964;
            border-radius: 12px;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>📸 Сканер волонтёров</h2>
        <p>Наведите камеру на QR-код</p>
        <div id="reader"></div>

        <div id="result-box">
            <p id="scanned-text" style="color: #4cd964; font-weight: bold; margin-bottom: 8px;"></p>
            <button id="send-btn" class="btn">📤 Отправить боту</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let scannedResult = "";
        const html5QrCode = new Html5Qrcode("reader");

        function onScanSuccess(decodedText) {
            scannedResult = decodedText.replace(/[^a-zA-Z0-9_]/g, '');

            document.getElementById('scanned-text').innerText = "✅ Считано: " + scannedResult;
            document.getElementById('result-box').style.display = 'block';

            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }

            html5QrCode.stop().catch(err => console.log(err));
        }

        document.getElementById('send-btn').addEventListener('click', function() {
            if (scannedResult) {
                tg.sendData(scannedResult);
            } else {
                alert("QR-код еще не считан!");
            }
        });

        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 15, qrbox: { width: 200, height: 200 } },
            onScanSuccess
        ).catch(err => {
            html5QrCode.start({ facingMode: "user" }, { fps: 15, qrbox: { width: 200, height: 200 } }, onScanSuccess);
        });
    </script>
</body>
</html>
